name: Build Altheria APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 2 -type f -name 'ALTHERIA_Android_v1.0.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ALTHERIA_Android_v1.0.zip not found in repository root."
            exit 1
          fi
          mkdir -p _altheria
          unzip -q "$ZIP" -d _altheria
          ROOT="_altheria/ALTHERIA_Android_v1.0"
          test -f "$ROOT/settings.gradle"
          cp -a "$ROOT"/. .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: altheria-adventure-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
